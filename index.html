<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Steel City Rings</title>
<style>
:root{--black:#101820;--gold:#FFB612;--silver:#A5ACAF;--turf:#1a331a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--gold);font-family:monospace;overscroll-behavior:none;touch-action:none}
#cabinet{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:10px;background:radial-gradient(#1a1f26,#000)}
#crt{position:relative;width:100%;max-width:900px;aspect-ratio:860/300;background:var(--black);border:6px solid var(--gold);overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.overlay{position:absolute;inset:0;background:rgba(16,24,32,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.hidden{display:none}
.btn{background:#000;border:2px solid var(--gold);color:var(--gold);padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div id="cabinet">
<div id="crt">
<canvas id="game" width="860" height="300"></canvas>

<div id="start" class="overlay">
<h1>STEEL CITY RINGS</h1>
<button class="btn" id="btnPlay">PLAY</button>
</div>

<div id="death" class="overlay hidden">
<h2>GAME OVER</h2>
<button class="btn" id="btnAgain">RETRY</button>
</div>

</div>
</div>

<script>
(()=>{

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let rafId=null, paused=false;
let shake=0, hitStop=0;

let player, obstacles=[], distance=0;
let thrustHeld=false, inputBuffer=0, coyote=0;

const GROUND=260;

function reset(){
  player={x:120,y:GROUND,vy:0,onGround:true};
  obstacles=[];
  distance=0;
}

function spawn(){
  obstacles.push({x:860,y:GROUND,w:20,h:30});
}

function update(dt){

  coyote = player.onGround ? 0.1 : Math.max(0,coyote-dt);
  inputBuffer = Math.max(0,inputBuffer-dt);

  // JUMP
  if(inputBuffer>0 && (player.onGround||coyote>0)){
    player.vy=-520;
    player.onGround=false;
    inputBuffer=0;
    coyote=0;
    sfx.thrust();
  }

  // THRUST ASSIST
  if(thrustHeld && player.vy<0){
    player.vy-=700*dt;
  }

  // GRAVITY
  player.vy+=1850*dt;
  player.y+=player.vy*dt;

  if(player.y>=GROUND){
    player.y=GROUND;
    player.vy=0;
    player.onGround=true;
  }

  // obstacles
  obstacles.forEach(o=>o.x-=220*dt);

  if(Math.random()<0.02) spawn();

  obstacles.forEach(o=>{
    if(Math.abs(o.x-player.x)<20 && Math.abs(o.y-player.y)<20){
      shake=10;
      hitStop=0.06;
      reset();
    }
  });

  distance+=dt*100;
}

function render(){

  ctx.save();

  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    shake*=0.9;
  }

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,860,300);

  // player
  ctx.fillStyle="#FFB612";
  ctx.fillRect(player.x,player.y-20,20,20);

  // obstacles
  ctx.fillStyle="#A5ACAF";
  obstacles.forEach(o=>ctx.fillRect(o.x,o.y-20,o.w,o.h));

  ctx.restore();
}

function loop(t){
  if(paused)return;

  const dt=0.016;

  if(hitStop>0){
    hitStop-=dt;
    render();
    rafId=requestAnimationFrame(loop);
    return;
  }

  update(dt);
  render();
  rafId=requestAnimationFrame(loop);
}

function togglePause(){
  paused=!paused;
  if(paused){
    cancelAnimationFrame(rafId);
  }else{
    rafId=requestAnimationFrame(loop);
  }
}

// AUDIO
let audioCtx=new (window.AudioContext||window.webkitAudioContext)();

function beep(freq,dur,type='sine',vol=0.08){
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  const f=audioCtx.createBiquadFilter();

  o.type=type;
  o.frequency.value=freq;

  f.type='lowpass';
  f.frequency.value=1200;

  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);

  o.connect(f);
  f.connect(g);
  g.connect(audioCtx.destination);

  o.start();
  o.stop(audioCtx.currentTime+dur+0.05);
}

const sfx={
  thrust:()=>beep(200,0.05,'triangle',0.03),
  hit:()=>beep(120,0.2,'sawtooth',0.08)
};

// INPUT
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    thrustHeld=true;
    inputBuffer=0.1;
  }
});

window.addEventListener("keyup",e=>{
  if(e.code==="Space") thrustHeld=false;
});

// UI
document.getElementById("btnPlay").onclick=()=>{
  reset();
  document.getElementById("start").classList.add("hidden");
  rafId=requestAnimationFrame(loop);
};

document.getElementById("btnAgain").onclick=()=>{
  reset();
  document.getElementById("death").classList.add("hidden");
  rafId=requestAnimationFrame(loop);
};

reset();

})();
</script>
</body>
</html>
